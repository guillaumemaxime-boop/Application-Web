name: Sync Rancher Desktop

on:
  push:
    branches: [ main ]
    paths:
      - 'deploy/base/docker-compose.yml'
      - 'deploy/envs/local/**'
  workflow_dispatch:

concurrency:
  group: sync-rancher
  cancel-in-progress: true

jobs:
  apply:
    name: Apply local stack
    runs-on: [self-hosted, rancher-desktop]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR (so docker compose pull can fetch private images)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Inject secrets into env file
        env:
          JWT_SECRET: ${{ secrets.LOCAL_JWT_SECRET }}
          ADMIN_PASSWORD_HASH: ${{ secrets.LOCAL_ADMIN_PASSWORD_HASH }}
        run: |
          # Override JWT_SECRET if the GitHub secret is set
          if [ -n "$JWT_SECRET" ]; then
            sed -i "s|^JWT_SECRET=.*|JWT_SECRET=${JWT_SECRET}|" deploy/envs/local/.env
          fi
          # BCrypt hash needs $$ escaping for Docker Compose YAML interpolation
          if [ -n "$ADMIN_PASSWORD_HASH" ]; then
            ESCAPED="${ADMIN_PASSWORD_HASH//'$'/'$$'}"
            sed -i "s|^ADMIN_PASSWORD_HASH=.*|ADMIN_PASSWORD_HASH=${ESCAPED}|" deploy/envs/local/.env
          fi

      - name: Pull and (re)start the stack
        run: |
          docker compose \
            -f deploy/base/docker-compose.yml \
            --env-file deploy/envs/local/.env \
            pull
          docker compose \
            -f deploy/base/docker-compose.yml \
            --env-file deploy/envs/local/.env \
            up -d --remove-orphans

      - name: Show running services
        run: docker compose -f deploy/base/docker-compose.yml --env-file deploy/envs/local/.env ps

      - name: Health check (backend)
        shell: bash
        run: |
          for i in {1..12}; do
            if curl -fsS http://localhost:8080/actuator/health 2>/dev/null | grep -q UP; then
              echo "Backend healthy"; exit 0
            fi
            echo "Waiting for backend... ($i/12)"; sleep 10
          done
          echo "Backend health check failed — dumping logs:"
          docker compose -f deploy/base/docker-compose.yml --env-file deploy/envs/local/.env logs --tail=200
          exit 1

      - name: Health check (umami)
        shell: bash
        run: |
          for i in {1..12}; do
            if docker exec atelier-umami wget -q --spider http://127.0.0.1:3000/api/heartbeat 2>/dev/null; then
              echo "Umami healthy"; exit 0
            fi
            echo "Waiting for umami... ($i/12)"; sleep 10
          done
          echo "Umami health check failed — dumping logs:"
          docker compose -f deploy/base/docker-compose.yml --env-file deploy/envs/local/.env logs --tail=200 umami
          exit 1

      - name: Prune dangling images
        if: success()
        run: docker image prune -f
