name: Build and Deploy

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: build-and-deploy
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests
    uses: ./.github/workflows/backend-tests.yml
    secrets: inherit

  frontend-test:
    name: Frontend Tests
    uses: ./.github/workflows/frontend-tests.yml
    secrets: inherit

  build:
    name: Build Docker Images
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}

      - name: Cache Node.js dependencies
        uses: actions/cache@v3
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}

      - name: Build backend
        working-directory: backend
        run: mvn clean package -DskipTests

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build -- --configuration=production

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image namespace
        if: github.ref == 'refs/heads/main'
        id: img
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build and push backend Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker build \
            -t ghcr.io/${{ steps.img.outputs.owner }}/portfolio-backend:latest \
            -t ghcr.io/${{ steps.img.outputs.owner }}/portfolio-backend:${{ github.sha }} \
            -f backend/Dockerfile backend
          docker push ghcr.io/${{ steps.img.outputs.owner }}/portfolio-backend:latest
          docker push ghcr.io/${{ steps.img.outputs.owner }}/portfolio-backend:${{ github.sha }}

      - name: Build and push frontend Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker build \
            -t ghcr.io/${{ steps.img.outputs.owner }}/portfolio-frontend:latest \
            -t ghcr.io/${{ steps.img.outputs.owner }}/portfolio-frontend:${{ github.sha }} \
            -f frontend/Dockerfile frontend
          docker push ghcr.io/${{ steps.img.outputs.owner }}/portfolio-frontend:latest
          docker push ghcr.io/${{ steps.img.outputs.owner }}/portfolio-frontend:${{ github.sha }}

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          # Here you would typically deploy to a server
          # Example: SSH into server and run docker-compose up -d
          echo "Deploying to production..."
          # Uncomment and configure the following for actual deployment:
          # ssh -o StrictHostKeyChecking=no user@server "cd /path/to/app && docker-compose pull && docker-compose up -d"

  redeploy-rancher:
    name: Redeploy on Rancher Desktop
    needs: build
    # Requires a self-hosted runner registered on the local machine where
    # Rancher Desktop is installed, with the labels below applied at install time.
    # See: https://docs.github.com/en/actions/hosting-your-own-runners
    runs-on: [self-hosted, rancher-desktop]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Rancher Desktop docker engine is reachable
        run: |
          docker version
          docker compose version

      - name: Rebuild and (re)start the stack
        run: docker compose -f docker-compose.yml up -d --build --remove-orphans

      - name: Show running services
        run: docker compose -f docker-compose.yml ps

      - name: Health check (backend)
        shell: bash
        run: |
          for i in {1..12}; do
            if curl -fsS http://localhost:8080/actuator/health 2>/dev/null | grep -q UP; then
              echo "Backend healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/12)"
            sleep 10
          done
          echo "Backend health check failed — dumping logs:"
          docker compose -f docker-compose.yml logs --tail=200
          exit 1

      - name: Prune dangling images
        if: success()
        run: docker image prune -f
