name: Build and Deploy

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
      - 'deploy/**'
  workflow_dispatch:

concurrency:
  group: build-and-deploy
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests
    uses: ./.github/workflows/backend-tests.yml
    secrets: inherit

  frontend-test:
    name: Frontend Tests
    uses: ./.github/workflows/frontend-tests.yml
    secrets: inherit

  build:
    name: Build Docker Images
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.img.outputs.sha }}
      owner: ${{ steps.img.outputs.owner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image namespace and short SHA
        id: img
        run: |
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build and push backend Docker image
        run: |
          docker build \
            -t ghcr.io/${{ steps.img.outputs.owner }}/portfolio-backend:latest \
            -t ghcr.io/${{ steps.img.outputs.owner }}/portfolio-backend:${{ steps.img.outputs.sha }} \
            -f backend/Dockerfile backend
          docker push ghcr.io/${{ steps.img.outputs.owner }}/portfolio-backend:latest
          docker push ghcr.io/${{ steps.img.outputs.owner }}/portfolio-backend:${{ steps.img.outputs.sha }}

      - name: Build and push frontend Docker image
        run: |
          docker build \
            -t ghcr.io/${{ steps.img.outputs.owner }}/portfolio-frontend:latest \
            -t ghcr.io/${{ steps.img.outputs.owner }}/portfolio-frontend:${{ steps.img.outputs.sha }} \
            -f frontend/Dockerfile frontend
          docker push ghcr.io/${{ steps.img.outputs.owner }}/portfolio-frontend:latest
          docker push ghcr.io/${{ steps.img.outputs.owner }}/portfolio-frontend:${{ steps.img.outputs.sha }}

  bump-staging:
    name: Bump staging versions.yaml
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update staging versions.yaml
        env:
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          sed -i -E "s|(^[[:space:]]*tag:).*|\1 \"${SHA}\"|g" deploy/envs/staging/versions.yaml
          sed -i -E "s|(^[[:space:]]*tag:).*|\1 \"${SHA}\"|g" deploy/envs/local/versions.yaml
          sed -i -E "s|(BACKEND_IMAGE=ghcr.io/[^/]+/portfolio-backend):.*|\1:${SHA}|" deploy/envs/local/.env
          sed -i -E "s|(FRONTEND_IMAGE=ghcr.io/[^/]+/portfolio-frontend):.*|\1:${SHA}|" deploy/envs/local/.env

      - name: Commit and push bump
        env:
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          if git diff --quiet; then
            echo "Nothing to bump."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/envs/staging/versions.yaml deploy/envs/local/versions.yaml deploy/envs/local/.env
          git commit -m "chore(deploy): bump staging + local to ${SHA} [skip ci]"
          git push

  deploy-staging:
    name: Deploy to Staging (Railway)
    needs: [bump-staging]
    uses: ./.github/workflows/sync-staging.yml
    secrets: inherit
