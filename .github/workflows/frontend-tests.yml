name: Frontend Tests

on:
  push:
    branches: [ main, TestU, TU-front, init-doc ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: Run Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run unit tests (Karma + ChromeHeadlessNoSandbox)
        working-directory: frontend
        # ChromeHeadlessNoSandbox = ChromeHeadless + --no-sandbox --disable-gpu --disable-dev-shm-usage
        # Le flag --disable-dev-shm-usage est requis : /dev/shm du runner GitHub Actions est limite
        # (~64 Mio), et le bundle de tests sature alors silencieusement (specs non charges).
        run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox --code-coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 30

  visual:
    name: Visual regression tests
    runs-on: ubuntu-latest
    container:
      # Version pinned a celle de package.json (@playwright/test ^1.60.0).
      # Bumper les 2 ensemble pour garder le rendu identique CI / local.
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build app
        working-directory: frontend
        run: npx ng build --configuration=development

      - name: Run visual regression tests
        working-directory: frontend
        run: npx playwright test --config=e2e/playwright.config.ts

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            frontend/test-results/
            frontend/playwright-report/
            frontend/e2e/test-results/
            frontend/e2e/playwright-report/
          retention-days: 14
