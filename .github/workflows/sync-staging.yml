name: Sync Staging (Railway)

on:
  push:
    branches: [ main ]
    paths:
      - 'deploy/envs/staging/versions.yaml'
  workflow_call:
  workflow_dispatch:

jobs:
  apply:
    name: Promote SHA → :staging and redeploy on Railway
    runs-on: ubuntu-latest
    # Pas d'`environment: staging` : ce job n'a ni reviewers requis ni secrets
    # env-scoped (RAILWAY_TOKEN_STAGING + service IDs sont repo-level). La ligne
    # creait juste un deployment marker GitHub en doublon avec celui qu'emet
    # l'integration Railway↔GitHub (`application-web / staging`), qui reste la
    # source de verite du statut reel.
    concurrency:
      group: sync-staging
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Read target SHA from versions.yaml
        id: tag
        run: |
          BACKEND_TAG=$(yq '.backend.tag' deploy/envs/staging/versions.yaml)
          FRONTEND_TAG=$(yq '.frontend.tag' deploy/envs/staging/versions.yaml)
          if [[ -z "$BACKEND_TAG" || -z "$FRONTEND_TAG" || "$BACKEND_TAG" == "null" || "$FRONTEND_TAG" == "null" ]]; then
            echo "::error::staging/versions.yaml has empty tag(s); refuse to deploy"
            exit 1
          fi
          echo "backend_tag=$BACKEND_TAG" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=$FRONTEND_TAG" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Install crane (pinned)
        run: |
          curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.20.3/go-containerregistry_Linux_x86_64.tar.gz \
            | sudo tar xz -C /usr/local/bin crane

      - name: Authenticate crane to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Move :staging tag to target SHA
        run: |
          crane tag ghcr.io/${{ steps.tag.outputs.owner }}/portfolio-backend:${{ steps.tag.outputs.backend_tag }}  staging
          crane tag ghcr.io/${{ steps.tag.outputs.owner }}/portfolio-frontend:${{ steps.tag.outputs.frontend_tag }} staging

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Trigger Railway redeploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          BACKEND_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_BACKEND_STAGING }}
          FRONTEND_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_FRONTEND_STAGING }}
        run: |
          redeploy_with_retry() {
            local SERVICE_ID="$1"
            local MAX_ATTEMPTS=6
            local ATTEMPT=0
            until railway redeploy --service "$SERVICE_ID" --yes 2>&1; do
              ATTEMPT=$((ATTEMPT + 1))
              if [[ $ATTEMPT -ge $MAX_ATTEMPTS ]]; then
                echo "::error::Failed to redeploy service $SERVICE_ID after $MAX_ATTEMPTS attempts"
                return 1
              fi
              echo "Service busy (attempt $ATTEMPT/$MAX_ATTEMPTS), retrying in 20s..."
              sleep 20
            done
          }
          redeploy_with_retry "$BACKEND_SERVICE_ID"
          redeploy_with_retry "$FRONTEND_SERVICE_ID"

      - name: Wait for Railway deployments to stabilise
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          BACKEND_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_BACKEND_STAGING }}
          FRONTEND_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_FRONTEND_STAGING }}
        run: |
          echo "Waiting 30s for Railway to pick up new deployments..."
          sleep 30
          for SERVICE_ID in "$BACKEND_SERVICE_ID" "$FRONTEND_SERVICE_ID"; do
            STATUS=$(railway status --service "$SERVICE_ID" --json 2>/dev/null | jq -r '.deploymentStatus // "UNKNOWN"' || echo "UNKNOWN")
            echo "Service $SERVICE_ID status: $STATUS"
            if [[ "$STATUS" == "FAILED" || "$STATUS" == "CRASHED" ]]; then
              echo "::error::Service $SERVICE_ID deployment failed (status: $STATUS)"
              exit 1
            fi
          done
