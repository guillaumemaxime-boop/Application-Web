server {
    listen ${PORT};
    server_name _;

    # Resolver pour les hostnames d'upstream (Railway/K8s reattribuent l'IP a
    # chaque redeploy). NGINX_LOCAL_RESOLVERS est rempli par le script auto
    # /docker-entrypoint.d/15-local-resolvers.envsh depuis /etc/resolv.conf.
    # Combine a des proxy_pass avec variables (cf. plus bas), nginx re-resout
    # les hosts au runtime au lieu de cacher l'IP au boot.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/font-woff2 application/font-woff text/xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Variables d'upstream : leur evaluation force nginx a passer par le
    # resolver a chaque requete (subject au cache valid=10s), donc la nouvelle
    # IP du backend/umami est prise en compte sans restart du frontend.
    set $backend_upstream "${BACKEND_HOST}:${BACKEND_PORT}";
    set $umami_upstream "${UMAMI_HOST}:${UMAMI_PORT}";

    # Runtime env injection: served as a JS literal, evaluated before Angular bootstraps.
    # ${UMAMI_*} are substituted by Nginx's docker-entrypoint envsubst at container start.
    location = /env.js {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        return 200 'window.__UMAMI__={"websiteId":"${UMAMI_WEBSITE_ID}","shareToken":"${UMAMI_SHARE_TOKEN}"};';
    }

    # Umami tracker script (same-origin → no CSP relaxation needed)
    location = /umami.js {
        proxy_pass http://$umami_upstream/script.js;
        proxy_set_header Host $host;
    }

    # Umami event ingestion (the only Umami write endpoint exposed publicly)
    location = /umami/api/send {
        proxy_pass http://$umami_upstream/api/send;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Umami public share dashboard (consumed by the admin iframe).
    # Proxie a /share/ (pas /umami/share/) parce que SharePage.tsx d'Umami lit
    # window.location.pathname cote client et parse segments[3] comme nom de
    # section ; un prefixe /umami/ decale les segments et casse la logique.
    location /share/ {
        proxy_pass http://$umami_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Umami Next.js static bundles — referenced as absolute paths by the share dashboard HTML.
    # `^~` wins over the regex `\.(?:js|css...)$` location below.
    location ^~ /_next/ {
        proxy_pass http://$umami_upstream;
        proxy_set_header Host $host;
    }

    # Umami share-auth API — the share dashboard JS calls this to exchange the share token
    # for a JWT scoped to a single website.
    location ^~ /api/share/ {
        proxy_pass http://$umami_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Umami stats API — the share dashboard JS fetches pageviews, metrics, sessions here
    # using the JWT obtained from /api/share/. Auth is enforced by Umami itself.
    location ^~ /api/websites/ {
        proxy_pass http://$umami_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Explicit 404 for any other /umami/* route — the Umami admin UI must not be reachable.
    # Placed AFTER the more-specific blocks above; their `=` or longer-prefix matches win.
    location /umami/ {
        return 404;
    }

    # API proxy → backend service (docker compose: backend:8080, Railway: <service>.railway.internal:8080)
    # ^~ gives this prefix block priority over the regex rules below (needed for image file URLs under /api/)
    location ^~ /api/ {
        # Photos uploadees par les telephones modernes pesent facilement 3-10 MB ;
        # les videos auto-hebergees montent a plusieurs dizaines de MB.
        # Default nginx = 1 MB → 413 silencieux avant meme d'atteindre Spring
        # (cf. spring.servlet.multipart.max-file-size). On aligne sur le
        # max-request-size backend (200 MB).
        client_max_body_size 200M;

        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets hachés par Angular → cache 1 an immuable.
    # esbuild (builder Angular actuel) nomme les fichiers "<name>-<HASH>.<ext>"
    # (tiret + hash alphanumérique majuscule, ex. main-HRMQ73TK.js, chunk-XNGYCT7I.js).
    # L'ancien webpack utilisait "<name>.<hash>.js" (point + hash hexa) : on couvre
    # les deux pour rester robuste à un changement de builder.
    location ~* "(-[A-Z0-9]{8,}|\.[0-9a-f]{8,})\.(?:js|css|woff2?)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Autres assets statiques (images, fonts non hachées, svg)
    location ~* \.(?:woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Le shell SPA ne doit JAMAIS être servi périmé : index.html référence les
    # bundles hachés par leur nom. On force la revalidation à chaque chargement
    # (304 si inchangé). Sans ça, un index.html en cache pointe vers d'anciens
    # bundles → l'utilisateur doit faire Ctrl+F5 après chaque déploiement.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Angular SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
