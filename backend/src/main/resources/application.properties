spring.application.name=portfolio-backend

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin credentials
admin.username=${ADMIN_USERNAME}
admin.password-hash=${ADMIN_PASSWORD_HASH}
server.port=8080

management.endpoints.web.exposure.include=health
spring.jackson.date-format=yyyy-MM-dd

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:portfolio}
spring.datasource.username=${PGUSER:portfolio}
spring.datasource.password=${PGPASSWORD:portfolio}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:portfolio}
spring.liquibase.user=${PGUSER:portfolio}
spring.liquibase.password=${PGPASSWORD:portfolio}

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Cache Caffeine
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

# File upload (200MB pour couvrir les videos auto-hebergees)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
app.upload.dir=${UPLOAD_DIR:./uploads}
app.upload.base-url=/api/photos/files
# Image servie par defaut quand une reference est perdue (fichier absent). Vide => 404.
app.upload.fallback-image=${UPLOAD_FALLBACK_IMAGE:/logo.jpg}
app.video.base-url=/api/videos/files
app.video.transcode.enabled=${VIDEO_TRANSCODE_ENABLED:true}
app.video.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
app.video.ffprobe-path=${FFPROBE_PATH:ffprobe}
app.video.max-height=1080
app.video.crf=23
app.video.preset=medium
app.video.transcode-timeout-seconds=600
app.video.poster-offset-seconds=1
app.video.hls-time-seconds=6
app.video.hls-preset=veryfast
app.video.gc-grace-hours=${VIDEO_GC_GRACE_HOURS:24}

# Resend transactional mail
app.resend.api-key=${RESEND_API_KEY:}
