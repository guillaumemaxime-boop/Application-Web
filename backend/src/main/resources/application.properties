spring.application.name=portfolio-backend

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin credentials
admin.username=${ADMIN_USERNAME:admin}
admin.password-hash=${ADMIN_PASSWORD_HASH}
server.port=8080

management.endpoints.web.exposure.include=health,info
spring.jackson.date-format=yyyy-MM-dd

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:portfolio}
spring.datasource.username=${PGUSER:portfolio}
spring.datasource.password=${PGPASSWORD:portfolio}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:portfolio}
spring.liquibase.user=${PGUSER:portfolio}
spring.liquibase.password=${PGPASSWORD:portfolio}
