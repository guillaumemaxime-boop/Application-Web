spring.application.name=portfolio-backend

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin credentials
admin.username=${ADMIN_USERNAME}
admin.password-hash=${ADMIN_PASSWORD_HASH}
server.port=8080

management.endpoints.web.exposure.include=health
spring.jackson.date-format=yyyy-MM-dd

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:portfolio}
spring.datasource.username=${PGUSER:portfolio}
spring.datasource.password=${PGPASSWORD:portfolio}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:portfolio}
spring.liquibase.user=${PGUSER:portfolio}
spring.liquibase.password=${PGPASSWORD:portfolio}

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Cache Caffeine
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

# File upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=${UPLOAD_DIR:./uploads}
app.upload.base-url=/api/photos/files

# Symmetric encryption key for at-rest secrets (mail password)
app.secrets.key=${APP_SECRETS_KEY:}
