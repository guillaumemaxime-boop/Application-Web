databaseChangeLog:
  - changeSet:
      id: 024-add-story-id-column
      author: atelier-lumen
      changes:
        - addColumn:
            tableName: story_slide
            columns:
              - column:
                  name: story_id
                  type: varchar(50)

  - changeSet:
      id: 024-backfill-story-id
      author: atelier-lumen
      changes:
        - sql:
            comment: Backfill story_id en joignant story sur (owner_kind, owner_id)
            sql: |
              UPDATE story_slide ss
              SET story_id = (
                  SELECT s.id FROM story s
                  WHERE s.owner_kind = ss.owner_kind AND s.owner_id = ss.owner_id
              )

  - changeSet:
      id: 024-cleanup-orphan-slides-without-owner
      author: atelier-lumen
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: story_slide
            columnName: owner_kind
      changes:
        - sql:
            comment: Supprime les story_slide dont owner_kind ou owner_id est NULL/vide — slides irrécupérables (cas legacy data corrompue en prod/staging). Skippé si owner_kind a déjà été dropped (migration réussie au 1er coup).
            sql: |
              DELETE FROM story_slide
              WHERE story_id IS NULL
                AND (owner_kind IS NULL OR owner_kind = '' OR owner_id IS NULL OR owner_id = '')

  - changeSet:
      id: 024-seed-orphan-stories
      author: atelier-lumen
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: story_slide
            columnName: owner_kind
      changes:
        - sql:
            comment: |
              Crée une story de récupération pour tout (owner_kind, owner_id) avec slides orphelins (cas où le seed 023 n'a pas créé de story — par exemple owner supprimé, FK non enforcée historiquement, owner_kind inconnu). Skippé si owner_kind dropped.
            sql: |
              INSERT INTO story (id, owner_kind, owner_id, title, cover_image, slug, position, created_at)
              SELECT DISTINCT
                  'st-recov-' || ss.owner_kind || '-' || ss.owner_id,
                  ss.owner_kind,
                  ss.owner_id,
                  'Story (récupérée)',
                  '',
                  'story-recuperee-' || ss.owner_kind || '-' || ss.owner_id,
                  0,
                  CURRENT_TIMESTAMP
              FROM story_slide ss
              WHERE ss.story_id IS NULL
                AND NOT EXISTS (
                  SELECT 1 FROM story s
                  WHERE s.owner_kind = ss.owner_kind AND s.owner_id = ss.owner_id
                )

  - changeSet:
      id: 024-rebackfill-story-id
      author: atelier-lumen
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: story_slide
            columnName: owner_kind
      changes:
        - sql:
            comment: Re-backfill story_id pour les slides encore NULL après le seed de récupération. Skippé si owner_kind dropped.
            sql: |
              UPDATE story_slide ss
              SET story_id = (
                  SELECT s.id FROM story s
                  WHERE s.owner_kind = ss.owner_kind AND s.owner_id = ss.owner_id
              )
              WHERE ss.story_id IS NULL

  - changeSet:
      id: 024-add-story-id-not-null
      author: atelier-lumen
      changes:
        - addNotNullConstraint:
            tableName: story_slide
            columnName: story_id
            columnDataType: varchar(50)

  - changeSet:
      id: 024-add-story-id-fk
      author: atelier-lumen
      changes:
        - addForeignKeyConstraint:
            baseTableName: story_slide
            baseColumnNames: story_id
            referencedTableName: story
            referencedColumnNames: id
            constraintName: fk_story_slide_story
            onDelete: CASCADE

  - changeSet:
      id: 024-drop-old-owner-columns-and-index
      author: atelier-lumen
      changes:
        - dropIndex:
            indexName: idx_story_slide_owner_pos
            tableName: story_slide
        - dropColumn:
            tableName: story_slide
            columns:
              - column:
                  name: owner_kind
              - column:
                  name: owner_id
        - createIndex:
            indexName: idx_story_slide_story_pos
            tableName: story_slide
            columns:
              - column:
                  name: story_id
              - column:
                  name: position
