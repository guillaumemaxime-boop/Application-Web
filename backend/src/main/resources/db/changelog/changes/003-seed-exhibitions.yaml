              - column: { name: start_date, valueDate: "2025-06-21" }
              - column: { name: end_date, valueDate: "2025-09-30" }
              - column: { name: cover_image, value: "https://picsum.photos/seed/saison-cover/1200/800" }
              - column: { name: curator, value: "Pascale Mussard" }
              - column: { name: short_description, value: "Le mobilier face aux éléments, en plein air." }
              - column:
                  name: description
                  value: |
                    Pendant tout l'été, dix pièces de mobilier ont été exposées dans les jardins
                    de la Villa Noailles. Soumises au vent, à la lumière et à la pluie, elles
                    évoluent au fil des semaines : leurs traces sont documentées chaque jour.
              - column: { name: featured, valueBoolean: true }
        - insert:
            tableName: exhibition_gallery
            columns:
              - column: { name: exhibition_id, value: e-004 }
              - column: { name: position, valueNumeric: 0 }
