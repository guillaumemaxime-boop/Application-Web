databaseChangeLog:
  - changeSet:
      id: seed-exhibition-001-matieres
      author: atelier-lumen
      changes:
        - insert:
            tableName: exhibition
            columns:
              - column: { name: id, value: e-001 }
              - column: { name: title, value: "Matières silencieuses" }
              - column: { name: slug, value: matieres-silencieuses }
              - column: { name: venue, value: "Galerie Joseph" }
              - column: { name: city, value: Paris }
              - column: { name: country, value: France }
              - column: { name: start_date, valueDate: "2025-03-14" }
              - column: { name: end_date, valueDate: "2025-05-18" }
              - column: { name: cover_image, value: "https://picsum.photos/seed/matieres-cover/1200/800" }
              - column: { name: curator, value: "Léa Bornand" }
              - column: { name: short_description, value: "Une exploration du silence comme matière première." }
              - column:
                  name: description
                  value: |
                    Matières silencieuses réunit douze pièces de mobilier sculpté autour d'une question :
                    qu'est-ce qu'un objet qui se tait ? Présentée dans la nef de la Galerie Joseph,
                    l'exposition met en dialogue le bois, la pierre et le textile dans un parcours
                    immersif baigné d'une lumière naturelle filtrée.
              - column: { name: featured, valueBoolean: true }
        - insert:
            tableName: exhibition_gallery
            columns:
              - column: { name: exhibition_id, value: e-001 }
              - column: { name: position, valueNumeric: 0 }
              - column: { name: url, value: "https://picsum.photos/seed/matieres-1/1200/800" }
        - insert:
            tableName: exhibition_gallery
            columns:
              - column: { name: exhibition_id, value: e-001 }
              - column: { name: position, valueNumeric: 1 }
              - column: { name: url, value: "https://picsum.photos/seed/matieres-2/1200/800" }
        - insert:
            tableName: exhibition_gallery
            columns:
              - column: { name: exhibition_id, value: e-001 }
              - column: { name: position, valueNumeric: 2 }
              - column: { name: url, value: "https://picsum.photos/seed/matieres-3/1200/800" }
        - insert:
            tableName: exhibition_tag
            columns:
              - column: { name: exhibition_id, value: e-001 }
              - column: { name: position, valueNumeric: 0 }
              - column: { name: entry_value, value: Mobilier }
        - insert:
            tableName: exhibition_tag
            columns:
              - column: { name: exhibition_id, value: e-001 }
              - column: { name: position, valueNumeric: 1 }
              - column: { name: entry_value, value: Sculpture }
        - insert:
            tableName: exhibition_tag
            columns:
              - column: { name: exhibition_id, value: e-001 }
              - column: { name: position, valueNumeric: 2 }
              - column: { name: entry_value, value: "Lumière naturelle" }

  - changeSet:
      id: seed-exhibition-002-atelier
      author: atelier-lumen
      changes:
        - insert:
            tableName: exhibition
            columns:
              - column: { name: id, value: e-002 }
              - column: { name: title, value: "L'atelier ouvert" }
              - column: { name: slug, value: l-atelier-ouvert }
              - column: { name: venue, value: "Design Miami" }
              - column: { name: city, value: Miami }
              - column: { name: country, value: "États-Unis" }
              - column: { name: start_date, valueDate: "2024-12-03" }
              - column: { name: end_date, valueDate: "2024-12-08" }
              - column: { name: cover_image, value: "https://picsum.photos/seed/atelier-cover/1200/800" }
              - column: { name: curator, value: "Hans Verlaat" }
              - column: { name: short_description, value: "L'atelier reconstitué au cœur de la foire." }
              - column:
                  name: description
                  value: |
                    Pour Design Miami 2024, l'atelier a été démonté, transporté puis remonté à
                    l'identique sur le stand. Visiteurs et collectionneurs ont assisté en direct
                    à la fabrication d'une édition spéciale de douze tabourets.
              - column: { name: featured, valueBoolean: true }
        - insert:
            tableName: exhibition_gallery
            columns:
              - column: { name: exhibition_id, value: e-002 }
              - column: { name: position, valueNumeric: 0 }
              - column: { name: url, value: "https://picsum.photos/seed/atelier-1/1200/800" }
        - insert:
            tableName: exhibition_gallery
            columns:
              - column: { name: exhibition_id, value: e-002 }
              - column: { name: position, valueNumeric: 1 }
              - column: { name: url, value: "https://picsum.photos/seed/atelier-2/1200/800" }
        - insert:
            tableName: exhibition_tag
            columns:
              - column: { name: exhibition_id, value: e-002 }
              - column: { name: position, valueNumeric: 0 }
              - column: { name: entry_value, value: Performance }
        - insert:
            tableName: exhibition_tag
            columns:
              - column: { name: exhibition_id, value: e-002 }
              - column: { name: position, valueNumeric: 1 }
              - column: { name: entry_value, value: "Édition limitée" }
        - insert:
            tableName: exhibition_tag
            columns:
              - column: { name: exhibition_id, value: e-002 }
              - column: { name: position, valueNumeric: 2 }
              - column: { name: entry_value, value: "Foire internationale" }

  - changeSet:
      id: seed-exhibition-003-bois-lumiere
      author: atelier-lumen
      changes:
        - insert:
            tableName: exhibition
            columns:
              - column: { name: id, value: e-003 }
              - column: { name: title, value: "Bois & lumière" }
              - column: { name: slug, value: bois-et-lumiere }
              - column: { name: venue, value: "Fondation Cartier" }
              - column: { name: city, value: Tokyo }
              - column: { name: country, value: Japon }
              - column: { name: start_date, valueDate: "2024-09-01" }
              - column: { name: end_date, valueDate: "2024-11-24" }
              - column: { name: cover_image, value: "https://picsum.photos/seed/bois-cover/1200/800" }
              - column: { name: curator, value: "Mariko Tanaka" }
              - column: { name: short_description, value: "Dialogue entre menuiserie française et tradition japonaise." }
              - column:
                  name: description
                  value: |
                    Bois & lumière a été conçue comme une rencontre entre deux traditions du bois.
                    Six pièces de l'atelier ont été présentées en regard de six créations d'un
                    maître menuisier de Kyoto, dans une scénographie minimaliste signée Mariko
                    Tanaka.
              - column: { name: featured, valueBoolean: false }
        - insert:
            tableName: exhibition_gallery
            columns:
              - column: { name: exhibition_id, value: e-003 }
              - column: { name: position, valueNumeric: 0 }
              - column: { name: url, value: "https://picsum.photos/seed/bois-1/1200/800" }
        - insert:
            tableName: exhibition_gallery
            columns:
              - column: { name: exhibition_id, value: e-003 }
              - column: { name: position, valueNumeric: 1 }
              - column: { name: url, value: "https://picsum.photos/seed/bois-2/1200/800" }
        - insert:
            tableName: exhibition_gallery
            columns:
              - column: { name: exhibition_id, value: e-003 }
              - column: { name: position, valueNumeric: 2 }
              - column: { name: url, value: "https://picsum.photos/seed/bois-3/1200/800" }
        - insert:
            tableName: exhibition_tag
            columns:
              - column: { name: exhibition_id, value: e-003 }
              - column: { name: position, valueNumeric: 0 }
              - column: { name: entry_value, value: Collaboration }
        - insert:
            tableName: exhibition_tag
            columns:
              - column: { name: exhibition_id, value: e-003 }
              - column: { name: position, valueNumeric: 1 }
              - column: { name: entry_value, value: Japon }
        - insert:
            tableName: exhibition_tag
            columns:
              - column: { name: exhibition_id, value: e-003 }
              - column: { name: position, valueNumeric: 2 }
              - column: { name: entry_value, value: Bois }

