spring.application.name=portfolio-backend
server.port=0

management.endpoints.web.exposure.include=health,info
spring.jackson.date-format=yyyy-MM-dd

# H2 in PostgreSQL compatibility mode for local & CI tests
spring.datasource.url=jdbc:h2:mem:portfolio;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Auth / JWT (valeurs fixes pour les tests)
jwt.secret=portfolio-test-secret-key-used-in-ci-and-local-tests
jwt.expiration-ms=3600000
admin.username=admin
# BCrypt de "admin" (généré par Python bcrypt)
admin.password-hash=$2b$10$ylcY5PaYQeX8u3/tuDdSi.awSBx1KQ8ztLAyRTO6lOnqxPFzZUHZm
