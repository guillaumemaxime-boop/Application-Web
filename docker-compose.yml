services:
  postgres:
    image: postgres:16-alpine
    container_name: atelier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - atelier-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: atelier-lumen/backend:1.0.0
    container_name: atelier-backend
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: portfolio
      PGUSER: portfolio
      PGPASSWORD: portfolio
      JWT_SECRET: "portfolio-dev-secret-key-must-be-changed-in-production"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD_HASH: "$$2b$$10$$ylcY5PaYQeX8u3/tuDdSi.awSBx1KQ8ztLAyRTO6lOnqxPFzZUHZm"
    expose:
      - "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - atelier-net

  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.13.0
    container_name: atelier-umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://portfolio:portfolio@postgres:5432/portfolio?schema=umami
      DATABASE_TYPE: postgresql
      APP_SECRET: "${UMAMI_APP_SECRET:-umami-dev-secret-change-in-production-min-32-chars}"
      TRACKER_SCRIPT_NAME: umami
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/heartbeat"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - atelier-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: atelier-lumen/frontend:1.0.0
    container_name: atelier-frontend
    restart: unless-stopped
    environment:
      PORT: "80"
      BACKEND_HOST: backend
      BACKEND_PORT: "8080"
      UMAMI_HOST: umami
      UMAMI_PORT: "3000"
      UMAMI_WEBSITE_ID: "${UMAMI_WEBSITE_ID:-}"
      UMAMI_SHARE_TOKEN: "${UMAMI_SHARE_TOKEN:-}"
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
      umami:
        condition: service_started
    networks:
      - atelier-net

networks:
  atelier-net:
    driver: bridge

volumes:
  postgres-data:
