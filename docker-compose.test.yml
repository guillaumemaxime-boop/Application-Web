# Standalone test compose. Tests utilisent H2 en memoire et lisent toute leur
# configuration depuis backend/src/test/resources/application.properties — donc
# pas besoin de postgres, ni d'env vars en doublon, ni du reseau prod.
services:
  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    image: atelier-lumen/backend-test:1.0.0
    volumes:
      - ./backend/src:/workspace/src
      - ./backend/pom.xml:/workspace/pom.xml

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    image: atelier-lumen/frontend-test:1.0.0
    volumes:
      - ./frontend/src:/workspace/src
      - ./frontend/karma.conf.js:/workspace/karma.conf.js
      - ./frontend/angular.json:/workspace/angular.json
      - ./frontend/tsconfig.json:/workspace/tsconfig.json
      - ./frontend/tsconfig.app.json:/workspace/tsconfig.app.json
      - ./frontend/tsconfig.spec.json:/workspace/tsconfig.spec.json
