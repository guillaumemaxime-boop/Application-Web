# Image-based compose used by the Rancher Desktop runner (sync-rancher.yml).
# Image tags come from deploy/envs/<env>/.env. No build context here — the
# images are produced once on main by the build pipeline and consumed
# unchanged on every environment.
services:
  postgres:
    image: postgres:16-alpine
    container_name: atelier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [atelier-net]

  backend:
    image: ${BACKEND_IMAGE}
    container_name: atelier-backend
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      UPLOAD_DIR: /data/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads-data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks: [atelier-net]

  umami:
    image: ghcr.io/umami-software/umami:${UMAMI_VERSION:-postgresql-v2.13.0}
    container_name: atelier-umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
      TRACKER_SCRIPT_NAME: umami
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/heartbeat"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks: [atelier-net]

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: atelier-frontend
    restart: unless-stopped
    environment:
      PORT: "80"
      BACKEND_HOST: backend
      BACKEND_PORT: "8080"
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
      umami:
        condition: service_healthy
    networks: [atelier-net]

networks:
  atelier-net:
    driver: bridge

volumes:
  postgres-data:
  uploads-data:
